name: Nightly Racing Model Recalibration

on:
  schedule:
    # Runs daily at 12:30 UTC (11:30 PM AEDT)
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Run racing model recalibration
        run: python recalibrate_racing.py

      - name: Commit updated weights if changed
        run: |
          git config user.name "Nilovea Calibration Bot"
          git config user.email "actions@github.com"
          git add racing_model_weights.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-recalibrate racing_model_weights.json"
            git push
          fi
